# ============================================================================
# Alembic configuration for pdfbot
#
# This file does NOT hard-code the database URL. The real URL is injected
# at runtime by `src/pdfbot/db/migrations/env.py`, which reads Settings
# from `pdfbot.config` (and therefore from `.env`). Keeping the URL out of
# this file means:
#   * you can point Alembic at SQLite for local dev and PostgreSQL for
#     production without editing anything here;
#   * no credentials are ever committed to the repository.
# ============================================================================

[alembic]
# ----------------------------------------------------------------------------
# Script location
# ----------------------------------------------------------------------------
# Path (relative to this file) where revision scripts are stored.
script_location = src/pdfbot/db/migrations

# Filesystem path prepended to `sys.path` when Alembic runs.
# This makes `import pdfbot` work even if the package isn't installed.
prepend_sys_path = src

# Use the modern `pyproject.toml`-style naming for revision files:
#   <date>_<rev>_<slug>.py
# instead of the legacy hash-only names. Easier to sort and read in a repo.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# ----------------------------------------------------------------------------
# Database URL
# ----------------------------------------------------------------------------
# Left intentionally empty. `env.py` reads `Settings.postgres_dsn` (or falls
# back to a SQLite file under DATA_DIR) and calls
#   config.set_main_option("sqlalchemy.url", url)
# before the engine is created. The `%` characters in DSNs must be escaped
# as `%%` if ever written here — another reason to keep it empty.
sqlalchemy.url =

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
# Only these sections are read by Alembic. Any other `[logger_*]` sections
# are ignored. We use the stdlib `logging` config format here because
# Alembic predates the `.toml` era — the app itself uses `loguru`.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S